<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusConnect - Poslovni Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Zaglavlje -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">NexusConnect</h1>
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="switchTab('chat')" id="tab-chat" class="px-3 py-1.5 rounded-lg bg-blue-600 font-medium text-sm transition">Chat</button>
            <button onclick="switchTab('docs')" id="tab-docs" class="px-3 py-1.5 rounded-lg hover:bg-slate-700 font-medium text-sm transition">Dokumenti i Folderi</button>
            <button onclick="switchTab('users')" id="tab-users" class="px-3 py-1.5 rounded-lg hover:bg-slate-700 font-medium text-sm transition">Članovi</button>
            
            <div class="flex items-center gap-2 ml-4 bg-slate-700 px-3 py-1 rounded-lg">
                <span class="text-xs text-slate-400">Korisnik:</span>
                <select id="active-user-select" onchange="changeActiveUser(this.value)" class="bg-slate-800 text-slate-100 text-sm rounded px-2 py-1 outline-none">
                </select>
            </div>
        </div>
    </header>

    <!-- 1. Chat Sekcija -->
    <div id="view-chat" class="flex flex-1 overflow-hidden">
        <div class="w-64 bg-slate-800/50 border-r border-slate-700 p-4 flex flex-col gap-2">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kanali</h2>
            <button onclick="switchChannel('general')" id="btn-general" class="text-left px-3 py-2 rounded-lg bg-blue-600 font-medium transition"># generalni</button>
            <button onclick="switchChannel('fakture')" id="btn-fakture" class="text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition"># fakture-i-racuni</button>
            <button onclick="switchChannel('announcements')" id="btn-announcements" class="text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition"># obaveštenja</button>
        </div>

        <div class="flex-1 flex flex-col bg-slate-900">
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
            <form id="chat-form" class="p-4 bg-slate-800 border-t border-slate-700 flex gap-2">
                <input type="text" id="message-input" placeholder="Napišite poruku..." autocomplete="off"
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-medium transition">Pošalji</button>
            </form>
        </div>
    </div>

    <!-- 2. Dokumenti i Folderi Sekcija -->
    <div id="view-docs" class="flex-1 p-6 overflow-y-auto hidden flex flex-col">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-4">
            <h2 class="text-2xl font-bold text-slate-100">Arhiva i Fakture</h2>
            <div class="flex gap-2">
                <button onclick="openFolderModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-medium text-sm transition">+ Novi folder</button>
                <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium text-sm transition">+ Dodaj dokument</button>
            </div>
        </div>

        <!-- Traka za pretragu -->
        <div class="mb-4">
            <input type="text" id="search-input" oninput="filterDocuments()" placeholder="Pretraži račune ili fakture po nazivu..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 outline-none focus:border-blue-500 text-sm">
        </div>

        <!-- Lista Folderčića / Kategorija -->
        <div id="folders-container" class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-700">
        </div>
        
        <!-- Prikaz fajlova -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="documents-grid">
        </div>
    </div>

    <!-- 3. Članovi Sekcija -->
    <div id="view-users" class="flex-1 p-6 overflow-y-auto hidden max-w-4xl mx-auto w-full">
        <h2 class="text-2xl font-bold mb-4 text-slate-100">Upravljanje Članovima Tima</h2>
        
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 mb-6">
            <h3 class="text-lg font-semibold mb-3 text-slate-200">Dodaj novog kolegu</h3>
            <form id="add-user-form" onsubmit="addNewUser(event)" class="flex gap-3 flex-wrap">
                <input type="text" id="new-user-name" placeholder="Ime i prezime" required class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 flex-1 outline-none focus:border-blue-500">
                <input type="email" id="new-user-email" placeholder="Email adresa" required class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 flex-1 outline-none focus:border-blue-500">
                <select id="new-user-role" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none">
                    <option value="employee">Zaposleni</option>
                    <option value="manager">Menadžer</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-medium transition">Sačuvaj člana</button>
            </form>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-300 text-sm border-b border-slate-700">
                        <th class="p-3">Ime</th>
                        <th class="p-3">Email</th>
                        <th class="p-3">Uloga</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-slate-700 text-sm">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modali -->
    <div id="folder-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full">
            <h3 class="text-xl font-bold mb-4 text-slate-100">Kreiraj novi folder</h3>
            <form onsubmit="createNewFolder(event)" class="space-y-4">
                <input type="text" id="new-folder-name" placeholder="Naziv foldera (npr. Ugovori)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none focus:border-blue-500">
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeFolderModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">Otkaži</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium">Kreiraj</button>
                </div>
            </form>
        </div>
    </div>

    <div id="upload-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-md w-full">
            <h3 class="text-xl font-bold mb-4 text-slate-100">Upload dokumenta</h3>
            <form onsubmit="uploadDocument(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Naziv / Opis stavke</label>
                    <input type="text" id="doc-title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Izaberi folder</label>
                    <select id="doc-category" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Izaberi fajl (slika ili PDF)</label>
                    <input type="file" id="doc-file" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">Otkaži</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium">Pošalji</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://tvoj-render-link.onrender.com'; // Zamenite vašim linkom
        const socket = io(BACKEND_URL);
        let currentChannel = 'general';
        let currentUserId = 1;
        let allUsers = [];
        let allDocuments = [];
        let currentFolder = 'Sve';

        async function initApp() {
            await fetchUsers();
            await fetchDocuments();
        }
        initApp();

        async function fetchUsers() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/users`);
                allUsers = await res.json();
                const select = document.getElementById('active-user-select');
                select.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
                if (allUsers.length > 0) currentUserId = allUsers[0].id;

                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = allUsers.map(u => `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-3 font-medium text-slate-200">${u.name}</td>
                        <td class="p-3 text-slate-400">${u.email}</td>
                        <td class="p-3"><span class="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-xs">${u.role}</span></td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        function changeActiveUser(id) { currentUserId = parseInt(id); }

        async function addNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-user-name').value;
            const email = document.getElementById('new-user-email').value;
            const role = document.getElementById('new-user-role').value;
            const res = await fetch(`${BACKEND_URL}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, role })
            });
            if (res.ok) {
                document.getElementById('add-user-form').reset();
                await fetchUsers();
                alert("Korisnik dodat!");
            }
        }

        async function fetchDocuments() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/documents`);
                allDocuments = await res.json();
                // Dodajemo podrazumevani status ako ne postoji u bazi
                allDocuments = allDocuments.map(d => ({ ...d, status: d.status || 'Na čekanju' }));
                renderFoldersAndDocs();
            } catch (err) { console.error(err); }
        }

        function renderFoldersAndDocs() {
            const defaultCategories = ['Fiskalni računi', 'Fakture', 'Otpremnice'];
            const docCategories = [...new Set(allDocuments.map(d => d.category))];
            const allCategories = ['Sve', ...new Set([...defaultCategories, ...docCategories])];

            const foldersContainer = document.getElementById('folders-container');
            foldersContainer.innerHTML = allCategories.map(cat => `
                <button onclick="selectFolder('${cat}')" class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition ${currentFolder === cat ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    📁 ${cat}
                </button>
            `).join('');

            const selectCategory = document.getElementById('doc-category');
            const uploadCategories = [...new Set([...defaultCategories, ...docCategories])];
            selectCategory.innerHTML = uploadCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

            filterDocuments();
        }

        function filterDocuments() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = currentFolder === 'Sve' ? allDocuments : allDocuments.filter(d => d.category === currentFolder);
            if (searchQuery) {
                filtered = filtered.filter(d => d.title.toLowerCase().includes(searchQuery) || d.file_name.toLowerCase().includes(searchQuery));
            }

            const grid = document.getElementById('documents-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 col-span-full">Nema pronađenih stavki.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(d => {
                let statusColor = 'bg-amber-500/20 text-amber-400';
                if (d.status === 'Odobreno') statusColor = 'bg-blue-500/20 text-blue-400';
                if (d.status === 'Plaćeno') statusColor = 'bg-emerald-500/20 text-emerald-400';

                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-medium">${d.category}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full font-medium ${statusColor}">${d.status}</span>
                            </div>
                            <h3 class="text-lg font-semibold mt-3 text-slate-100">${d.title}</h3>
                            <p class="text-xs text-slate-400 mt-1">Fajl: ${d.file_name} • ${d.timestamp}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-700/50 flex items-center justify-between gap-2">
                            <select onchange="updateStatus(${d.id}, this.value)" class="bg-slate-900 text-xs text-slate-300 border border-slate-700 rounded px-2 py-1 outline-none">
                                <option value="Na čekanju" ${d.status === 'Na čekanju' ? 'selected' : ''}>Na čekanju</option>
                                <option value="Odobreno" ${d.status === 'Odobreno' ? 'selected' : ''}>Odobreno</option>
                                <option value="Plaćeno" ${d.status === 'Plaćeno' ? 'selected' : ''}>Plaćeno</option>
                            </select>
                            <div class="flex gap-2">
                                <a href="${d.file_data}" download="${d.file_name}" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg text-xs font-medium transition">Preuzmi</a>
                                <a href="${d.file_data}" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-lg text-xs font-medium transition">Otvori</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStatus(id, newStatus) {
            const doc = allDocuments.find(d => d.id === id);
            if (doc) {
                doc.status = newStatus;
                filterDocuments();
            }
        }

        function selectFolder(folder) { currentFolder = folder; renderFoldersAndDocs(); }
        function openFolderModal() { document.getElementById('folder-modal').classList.remove('hidden'); }
        function closeFolderModal() { document.getElementById('folder-modal').classList.add('hidden'); }
        function createNewFolder(e) {
            e.preventDefault();
            const name = document.getElementById('new-folder-name').value.trim();
            if (!name) return;
            currentFolder = name;
            closeFolderModal();
            document.getElementById('new-folder-name').value = '';
            renderFoldersAndDocs();
        }

        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

        async function uploadDocument(e) {
            e.preventDefault();
            const title = document.getElementById('doc-title').value;
            const category = document.getElementById('doc-category').value;
            const fileInput = document.getElementById('doc-file');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const res = await fetch(`${BACKEND_URL}/api/documents`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category, fileData: event.target.result, fileName: file.name, userId: currentUserId })
                });
                if (res.ok) {
                    closeUploadModal();
                    document.getElementById('doc-title').value = '';
                    fileInput.value = '';
                    await fetchDocuments();
                    alert("Uspešno sačuvano!");
                }
            };
            reader.readAsDataURL(file);
        }

        function switchTab(tab) {
            ['chat', 'docs', 'users'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = 'px-3 py-1.5 rounded-lg hover:bg-slate-700 font-medium text-sm transition';
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'px-3 py-1.5 rounded-lg bg-blue-600 font-medium text-sm transition';
        }

        function switchChannel(channel) {
            currentChannel = channel;
            ['general', 'fakture', 'announcements'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if(btn) btn.className = c === channel ? 'text-left px-3 py-2 rounded-lg bg-blue-600 font-medium transition' : 'text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition';
            });
            socket.emit('join_channel', channel);
        }

        socket.on('connect', () => socket.emit('join_channel', currentChannel));
        socket.on('load_messages', (msgs) => renderMessages(msgs));
        socket.on('receive_message', (msg) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML += `<div class="flex flex-col"><div class="flex items-baseline gap-2"><span class="font-semibold text-blue-400">${msg.user}</span><span class="text-xs text-slate-500">${msg.timestamp}</span></div><p class="text-slate-200 mt-1">${msg.content}</p></div>`;
            container.scrollTop = container.scrollHeight;
        });

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = messages.map(m => `<div class="flex flex-col"><div class="flex items-baseline gap-2"><span class="font-semibold text-blue-400">${m.user}</span><span class="text-xs text-slate-500">${m.timestamp}</span></div><p class="text-slate-200 mt-1">${m.content}</p></div>`).join('');
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            socket.emit('send_message', { channel: currentChannel, userId: currentUserId, content: input.value });
            input.value = '';
        });
    </script>
</body>
</html>
